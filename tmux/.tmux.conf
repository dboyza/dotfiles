set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g clock-mode-style 24
set -g focus-events on
setw -g mode-keys vi

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000
set -g set-titles on
set -g set-titles-string 'tmux:#S:#I:#W'

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
set -g extended-keys on
set -g pane-border-lines heavy
setw -gu window-style
setw -gu window-active-style

bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
unbind-key '"'
unbind-key \%
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key & kill-window
bind-key x kill-pane
bind-key -n PPage copy-mode -u
bind-key -n NPage copy-mode \; send-keys -X page-down
bind-key -n C-PPage copy-mode \; send-keys -X scroll-up
bind-key -n C-NPage copy-mode \; send-keys -X scroll-down
bind-key y copy-mode
bind-key Up copy-mode -u
bind-key Down send-keys -X page-down
bind-key -T copy-mode-vi v send-keys -X cursor-left \; send-keys -X begin-selection
bind-key -T copy-mode-vi S-C-c send-keys -X copy-pipe-and-cancel 'cat | clip.exe'
bind-key -T copy-mode-vi S-C-v send-keys -X cancel \; run-shell 'powershell.exe -NoProfile -Command "Write-Host -NoNewline (Get-Clipboard -Raw)" | tmux load-buffer - && tmux paste-buffer -t #{pane_id}'
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel 'cat | clip.exe'
bind-key -T copy-mode-vi C-v send-keys -X cancel \; run-shell 'powershell.exe -NoProfile -Command "Write-Host -NoNewline (Get-Clipboard -Raw)" | tmux load-buffer - && tmux paste-buffer -t #{pane_id}'
bind-key -n S-C-v run-shell 'powershell.exe -NoProfile -Command "Write-Host -NoNewline (Get-Clipboard -Raw)" | tmux load-buffer - && tmux paste-buffer -t #{pane_id}'
bind-key -n C-v run-shell 'powershell.exe -NoProfile -Command "Write-Host -NoNewline (Get-Clipboard -Raw)" | tmux load-buffer - && tmux paste-buffer -t #{pane_id}'
bind-key -T copy-mode-vi PPage send-keys -X page-up
bind-key -T copy-mode-vi NPage send-keys -X page-down
bind-key -T copy-mode-vi C-PPage send-keys -X scroll-up
bind-key -T copy-mode-vi C-NPage send-keys -X scroll-down
bind-key -T copy-mode-vi Escape send-keys -X cancel

set -g status 2
set -g status-position top
set -g status-style "bg=default,fg=#908caa"
set -g status-left ""
set -g status-right ""
set -g status-right-length 20
set -g window-status-separator " "
setw -g window-status-format "#[fg=#908caa,bg=default]  #I: #W  "
setw -g window-status-current-format "#[fg=#191724,bg=#f6c177,bold]  #I: #W  "
set -g status-format[1] "#[fg=#524f67,bg=default]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#f6c177"
set -g display-panes-colour "#eb6f92"
set -g display-panes-active-colour "#f6c177"
set -g message-style "bg=#f6c177,fg=#191724"
set -g mode-style "bg=#ebbcba,fg=#191724"

# Clipboard
set -g set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",wezterm:clipboard"

# Navigation
bind-key -n M-h if-shell -F '#{m/r:^(nvim|vim|view)$,#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell -F '#{m/r:^(nvim|vim|view)$,#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell -F '#{m/r:^(nvim|vim|view)$,#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell -F '#{m/r:^(nvim|vim|view)$,#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'
bind-key s choose-tree -s
bind-key w choose-tree -w

# Pickers and layout
bind-key q display-panes
bind-key z resize-pane -Z
bind-key Space next-layout
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key $ command-prompt -I "#S" "rename-session '%%'"

# tmux-yank
set -g @override_copy_command 'cat | clip.exe'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
